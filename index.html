<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Staging site: keep search engines away. Remove this line only on the live site. -->
<meta name="robots" content="noindex, nofollow">
<title>Visor · Shutterchi staging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@300;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#ffffff;--ink:#000000;--text:#5a5a5a;--blue:#0b51c1;--tint-blue:#f1f6fd;
        --font:"Catamaran",system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--tint-blue);
       font-family:var(--font);color:var(--text);padding:24px}
  main{background:var(--bg);border-radius:24px;padding:40px 44px;max-width:460px;
       box-shadow:0 4px 18px rgba(0,0,0,.08)}
  h1{margin:0 0 8px;color:var(--ink);font-weight:600;font-size:32px}
  p{margin:0 0 12px;font-weight:300;font-size:18px;line-height:1.5}
  a{color:var(--blue);font-weight:500}
</style>
</head>
<body>
<main>
  <h1>Visor</h1>
  <p>This is the staging area for the new shutterchi.com. Work in progress lives here.</p>
  <p>The current site is at <a href="https://www.shutterchi.com">www.shutterchi.com</a>.</p>
</main>
</body>
</html>
